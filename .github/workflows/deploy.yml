# main 에 코드가 합쳐지면 EC2 에 자동 배포합니다. (수동 실행: Actions 탭 -> Deploy to EC2 -> Run workflow)
# 필요한 Secrets (Settings -> Secrets and variables -> Actions):
#   EC2_HOST     EC2 퍼블릭 IPv4 주소 (인스턴스를 중지/시작하면 바뀜)
#   EC2_USER     ec2-user
#   EC2_SSH_KEY  배포 전용 SSH 개인 키 전체 내용
name: Deploy to EC2

on:
  push:
    branches: [main]
    paths:                       # 서비스에 영향 없는 문서(md) 수정만으로는 배포하지 않음
      - "api/**"
      - "web/**"
      - "scripts/**"
      - "data/**"
      - "docker-compose.yml"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

# 같은 워크플로가 겹쳐 돌지 않도록 한 번에 하나만 (나머지는 순서를 기다림)
concurrency:
  group: deploy-ec2
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      EC2_HOST: ${{ secrets.EC2_HOST }}
      EC2_USER: ${{ secrets.EC2_USER }}
      EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
    steps:
      - uses: actions/checkout@v4

      - name: Secrets 확인
        run: |
          for v in EC2_HOST EC2_USER EC2_SSH_KEY; do
            if [ -z "${!v}" ]; then echo "::error::Secret $v 가 설정되지 않았습니다."; exit 1; fi
          done

      - name: SSH 준비
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$EC2_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H -T 15 "$EC2_HOST" >> ~/.ssh/known_hosts

      - name: EC2 에 배포
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes "$EC2_USER@$EC2_HOST" \
            "REPO_URL=https://github.com/${{ github.repository }}.git BRANCH=main bash -s" < scripts/deploy_ec2.sh

      - name: 바깥에서 접속 확인
        run: |
          curl -fsS --retry 5 --retry-delay 5 "http://$EC2_HOST/health" | head -c 200; echo
          echo "배포 커밋 ${GITHUB_SHA::7} 확인 완료" >> "$GITHUB_STEP_SUMMARY"
